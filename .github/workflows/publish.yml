name: Release to npm

# Every push to main publishes a new version.
# The default bump is patch. Put [minor] or [major] in the subject line of any commit
# since the last release to bump that part instead, or run this workflow
# manually and pick the bump.
#
# The release does not add a commit to main. The version comes from the
# latest v* tag, is set in package.json for this run only, and the merge
# commit is tagged with it. Release notes go to GitHub Releases.

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            bump:
                description: "Version bump"
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch

permissions:
    id-token: write
    contents: write

# Run releases one at a time so two merges cannot claim the same version.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  # Check out the branch tip, not the triggering commit, so a
                  # queued run includes everything merged before it.
                  ref: main
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: "https://registry.npmjs.org"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Work out the release version
              id: release
              env:
                  INPUT_BUMP: ${{ inputs.bump }}
              run: |
                  PACKAGE_NAME=$(node -p "require('./package.json').name")
                  TAGS=$(git tag --merged HEAD --list 'v*' --sort=-v:refname)
                  LAST_TAG=$(echo "$TAGS" | sed -n 1p)

                  if [ "$(git rev-parse "$LAST_TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
                    # This commit is already tagged, so an earlier run failed
                    # after tagging. Finish that release.
                    TAG="$LAST_TAG"
                    PREVIOUS_TAG=$(echo "$TAGS" | sed -n 2p)
                    VERSION="${TAG#v}"
                    if [ "$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                    else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                    fi
                    echo "new_tag=false" >> "$GITHUB_OUTPUT"
                  else
                    # Only read commit subjects (first lines), so text in commit
                    # bodies or Dependabot descriptions cannot change the bump.
                    SUBJECTS=$(git log "$LAST_TAG..HEAD" --format=%s)
                    if [ -n "$INPUT_BUMP" ]; then
                      BUMP="$INPUT_BUMP"
                    elif echo "$SUBJECTS" | grep -qF '[major]'; then
                      BUMP=major
                    elif echo "$SUBJECTS" | grep -qF '[minor]'; then
                      BUMP=minor
                    else
                      BUMP=patch
                    fi
                    PREVIOUS_TAG="$LAST_TAG"
                    VERSION=$(node -e '
                      const [bump, last] = process.argv.slice(1);
                      let [major, minor, patch] = last.split(".").map(Number);
                      if (bump === "major") { major++; minor = 0; patch = 0; }
                      else if (bump === "minor") { minor++; patch = 0; }
                      else { patch++; }
                      console.log(`${major}.${minor}.${patch}`);
                    ' "$BUMP" "${LAST_TAG#v}")
                    TAG="v$VERSION"
                    echo "Bump: $BUMP"
                    echo "publish=true" >> "$GITHUB_OUTPUT"
                    echo "new_tag=true" >> "$GITHUB_OUTPUT"
                  fi

                  echo "Release: $TAG"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

                  git log "$PREVIOUS_TAG..HEAD" --no-merges --format='- %s' | grep -v '^- 🔖' > "$RUNNER_TEMP/notes.md" || true
                  if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
                    echo "- No changes recorded" > "$RUNNER_TEMP/notes.md"
                  fi

            # Tag before publishing so a failed publish can be retried by
            # re-running this workflow.
            - name: Tag release
              if: steps.release.outputs.new_tag == 'true'
              run: |
                  git tag "${{ steps.release.outputs.tag }}"
                  git push origin "${{ steps.release.outputs.tag }}"

            - name: Publish
              if: steps.release.outputs.publish == 'true'
              run: |
                  npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version
                  npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  TAG="${{ steps.release.outputs.tag }}"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "GitHub release $TAG already exists."
                  else
                    gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
                  fi
